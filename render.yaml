# Render Blueprint（后端）。Render 控制台 New → Blueprint 指向本仓库即可读取。
# 数据库(Neon)与 Redis(Upstash/Render Key Value) 用各自面板创建后，把连接串填到下面 sync:false 的变量里。
services:
  - type: web
    name: echo-post-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 跨源部署：cookie 用 SameSite=None;Secure，浏览器才会在 Pages→API 的请求里带上
      - key: COOKIE_CROSS_SITE
        value: 'true'
      # 允许的前端源（GitHub Pages 地址），逗号分隔可多个
      - key: CORS_ORIGIN
        sync: false
      # Neon Postgres 连接串（含 ?sslmode=require）
      - key: DATABASE_URL
        sync: false
      # Redis 连接串（Upstash 用 rediss://，Render Key Value 用内网地址）
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: '900'
      - key: JWT_REFRESH_TTL
        value: '2592000'
      # 邮件（真实发验证码）
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
